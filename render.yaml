services:
  - type: web
    name: tracker-financiero-backend
    env: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0

  - type: web
    name: tracker-financiero-frontend
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist_deploy
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
